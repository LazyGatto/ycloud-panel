version: "3.9"
services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
